[package]
name = "midas"
version = "0.1.0"
description = "flow — a beautiful personal expense tracker"
authors = ["mohanraj"]
edition = "2021"

# The binary carries the app's name. `tauri dev` runs it bare, outside any
# bundle, and the Dock names a bare process after its executable — so a binary
# called midas showed up as midas there. The package and the bundle identifier
# stay midas: the identifier is where the book lives on disk.
[[bin]]
name = "flow"
path = "src/main.rs"

[lib]
name = "midas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-plugin-native-tabs = { path = "plugins/native-tabs" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
# Prices are fetched from Rust rather than the webview: no CORS to work
# around, and the cache lands in SQLite alongside everything else. Tauri gates
# its own copy of reqwest to other targets, so it needs asking for by name.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "charset",
    "http2",
    "query",
    "rustls",
] }
tauri-plugin-dialog = "2.7.2"
# Bank statements arrive as the .xls files banks still export — legacy BIFF,
# not zipped XML — and calamine reads both without a JS bridge in the middle.
calamine = "0.26"
# Statements go to Claude as base64 — PDFs and pictures as themselves.
base64 = "0.22"
# A pasted Claude API key lives in the macOS Keychain, never in the book.
keyring = { version = "3", features = ["apple-native", "windows-native"] }

# Reaching the WKWebView itself, for the one thing the page cannot say from
# inside it: iOS 26's blur over the status bar. See `hide_edge_blur`.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
